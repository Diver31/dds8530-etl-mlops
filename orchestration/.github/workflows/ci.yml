name: Source and model release checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  repository-and-serving:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: deployment/requirements.txt
      - name: Install release serving requirements
        run: python -m pip install -r deployment/requirements.txt
      - name: Validate source, lineage, and paths
        run: python -m unittest discover -s tests -p 'test_repository_structure.py' -v
      - name: Train locked configuration on development data
        run: python scripts/build_release_model.py
      - name: Verify approved model HTTP contract
        run: python -m unittest discover -s tests -p 'test_release_service.py' -v
      - name: Verify Docker model image build
        run: docker build -t dds8530-forecast-api:ci .
      - name: Validate Compose definitions
        shell: bash
        run: |
          cp .env.example .env
          cp orchestration/db.env.example orchestration/db.env
          docker compose -f compose.yaml -f compose.override.yaml config --quiet
          docker compose -f orchestration/compose.yaml config --quiet
